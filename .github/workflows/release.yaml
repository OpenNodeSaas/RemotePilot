name: Release

# 打 v* 标签时自动出包并创建 GitHub Release；也可在 Actions 页面手动触发。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v2.0.1)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet test -c Release --nologo

      - name: Publish packages
        run: pwsh -File scripts/publish.ps1

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          gh release create "$env:TAG" `
            artifacts/RemotePilot-win-x64.zip `
            artifacts/RemotePilot-single-win-x64.zip `
            --title "$env:TAG" `
            --generate-notes
